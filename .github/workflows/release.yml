name: Build and Push TheLake Docker Image

# Softprobe convention: GitHub Release vX.Y.Z → make release
# (test-perf + build-release + publish; all --release. PR make ci already gated.)
# Publishes to public Docker Hub: softprobe/thelake:<tag> (and :latest for non-prerelease).
# Warm SLO: ≤ 25m (hard timeout 35m).
# Cache: ~/.cache/thelake via Make + actions/cache on registry + target.
on:
  release:
    types: [published]

env:
  IMAGE_TAG: ${{ github.event.release.tag_name }}
  CI: "true"
  CARGO_INCREMENTAL: "0"
  ENFORCE_SLO: "1"
  PERF_TARGET_MS: "1000"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      # Must stay inline and before checkout: root-owned warehouse/ blocks actions/checkout.
      - name: Pre-clean workspace permissions
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE:-$PWD}"
          if [[ -d "$WS" ]]; then
            sudo rm -rf "$WS/warehouse" || true
            sudo chown -R "$(id -u):$(id -g)" "$WS" || true
          fi

      - uses: actions/checkout@v5

      - name: Restore build cache
        uses: ./.github/actions/thelake-cache

      - name: Bootstrap ubuntu runner
        uses: ./.github/actions/ubuntu-runner

      - name: Doctor
        run: make doctor

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: softprobe
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Start local test infra
        run: make setup

      - name: Release gate (test-perf + build-release + publish)
        run: |
          set -euo pipefail
          if [[ "${{ github.event.release.prerelease }}" == "true" ]]; then
            make release TAG="${IMAGE_TAG}" TAG_LATEST=0
          else
            make release TAG="${IMAGE_TAG}"
          fi

      - name: Teardown local infra
        if: always()
        run: make teardown
