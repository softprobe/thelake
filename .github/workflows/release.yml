name: Build and Push TheLake Docker Image

# Softprobe convention: GitHub Release vX.Y.Z → make release
# (test-perf + build-release + publish; all --release. PR make ci already gated.)
# Publishes to public Docker Hub: softprobe/thelake:<tag> (and :latest for non-prerelease).
# Warm SLO: ≤ 25m (hard timeout 35m).
# Cache: ~/.cache/thelake via Make + actions/cache on registry + target.
on:
  release:
    types: [published]

env:
  IMAGE_TAG: ${{ github.event.release.tag_name }}
  CI: "true"
  CARGO_INCREMENTAL: "0"
  ENFORCE_SLO: "1"
  PERF_TARGET_MS: "1000"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      # Must stay inline and before checkout: root-owned warehouse/ blocks actions/checkout.
      - name: Pre-clean workspace permissions
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE:-$PWD}"
          if [[ -d "$WS" ]]; then
            sudo rm -rf "$WS/warehouse" || true
            sudo chown -R "$(id -u):$(id -g)" "$WS" || true
          fi

      - uses: actions/checkout@v5

      - name: Set up Node.js for the embedded Explorer
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/thelake-explorer/package-lock.json

      - name: Set up Go for thelake-collector
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: collector/go.sum

      - name: Publish versioned thelake Explorer package
        working-directory: packages/thelake-explorer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event.release.prerelease }}" == "true" ]]; then
            echo "This is a container prerelease for staging; skipping npm publication."
            exit 0
          fi
          if [[ -z "${NODE_AUTH_TOKEN}" ]]; then
            echo "NPM_TOKEN is not set; skipping npm publish. The Docker image publish still runs."
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version
          npm ci
          npm run build
          npm publish --access public

      - name: Restore build cache
        uses: ./.github/actions/thelake-cache

      - name: Bootstrap ubuntu runner
        uses: ./.github/actions/ubuntu-runner

      - name: Doctor
        run: make doctor

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: softprobe
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote verified GHCR images or fall back to source build
        env:
          SOURCE_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          thelake_src="ghcr.io/${REPO}:sha-${SOURCE_SHA}"
          collector_src="ghcr.io/${REPO}-collector:sha-${SOURCE_SHA}"
          if docker buildx imagetools inspect "${thelake_src}" >/dev/null 2>&1 && \
             docker buildx imagetools inspect "${collector_src}" >/dev/null 2>&1; then
            thelake_tags=(--tag "softprobe/thelake:${IMAGE_TAG}")
            collector_tags=(--tag "softprobe/thelake-collector:${IMAGE_TAG}")
            if [[ "${{ github.event.release.prerelease }}" != "true" ]]; then
              thelake_tags+=(--tag "softprobe/thelake:latest")
              collector_tags+=(--tag "softprobe/thelake-collector:latest")
            fi
            docker buildx imagetools create "${thelake_tags[@]}" "${thelake_src}"
            docker buildx imagetools create "${collector_tags[@]}" "${collector_src}"
            exit 0
          fi

          echo "GHCR CI image missing for ${SOURCE_SHA}; running full release build."
          make setup
          trap 'make teardown' EXIT
          if [[ "${{ github.event.release.prerelease }}" == "true" ]]; then
            make release TAG="${IMAGE_TAG}" TAG_LATEST=0
          else
            make release TAG="${IMAGE_TAG}"
          fi
