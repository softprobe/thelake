name: CI

# Pre-merge / main push: make doctor → unit checks → two parallel DuckLake E2E jobs.
# Dev Cargo profile only (clippy + tests share one compile). Warm SLO ≤ 18m.
# Cache: ~/.cache/thelake via Make + actions/cache on registry + target.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DUCKDB_DOWNLOAD_LIB: "1"

jobs:
  ci:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      CARGO_INCREMENTAL: "0"
      ENFORCE_SLO: "1"

    steps:
      # Must stay inline and before checkout: root-owned warehouse/ blocks actions/checkout.
      - name: Pre-clean workspace permissions
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE:-$PWD}"
          if [[ -d "$WS" ]]; then
            sudo rm -rf "$WS/warehouse" || true
            sudo chown -R "$(id -u):$(id -g)" "$WS" || true
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore build cache
        uses: ./.github/actions/thelake-cache

      - name: Bootstrap ubuntu runner
        uses: ./.github/actions/ubuntu-runner

      - name: Doctor
        run: make doctor

      - name: CI checks (fmt, lint, unit tests)
        run: |
          make check-fmt
          make lint
          make test

  e2e-isolated:
    name: E2E (isolated DuckLake)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      CARGO_INCREMENTAL: "0"
      ENFORCE_SLO: "1"
      WORKSPACE_SCOPE_MODE: isolated
      SPLAKE_RESET_DUCKLAKE: "1"

    steps:
      - name: Pre-clean workspace permissions
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE:-$PWD}"
          if [[ -d "$WS" ]]; then
            sudo rm -rf "$WS/warehouse" || true
            sudo chown -R "$(id -u):$(id -g)" "$WS" || true
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore build cache
        uses: ./.github/actions/thelake-cache

      - name: Bootstrap ubuntu runner
        uses: ./.github/actions/ubuntu-runner

      - name: Start local test infra
        run: make setup

      - name: Run isolated DuckLake E2E suite
        run: |
          make ensure-cache
          make test-lease-pg
          ./scripts/run-isolated-cargo-tests.sh \
            --features integration-e2e \
            --test tests \
            --list-prefix integration::

      - name: Teardown local infra
        if: always()
        run: make teardown

  e2e-shared:
    name: E2E (shared DuckLake)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      CARGO_INCREMENTAL: "0"
      ENFORCE_SLO: "1"
      WORKSPACE_SCOPE_MODE: shared
      SPLAKE_RESET_DUCKLAKE: "1"

    steps:
      - name: Pre-clean workspace permissions
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE:-$PWD}"
          if [[ -d "$WS" ]]; then
            sudo rm -rf "$WS/warehouse" || true
            sudo chown -R "$(id -u):$(id -g)" "$WS" || true
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore build cache
        uses: ./.github/actions/thelake-cache

      - name: Bootstrap ubuntu runner
        uses: ./.github/actions/ubuntu-runner

      - name: Start local test infra
        run: make setup

      - name: Run shared DuckLake E2E suite
        run: |
          make ensure-cache
          make test-lease-pg
          ./scripts/run-isolated-cargo-tests.sh \
            --features integration-e2e \
            --test tests \
            --list-prefix integration::

      - name: Teardown local infra
        if: always()
        run: make teardown
