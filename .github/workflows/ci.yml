name: CI

# Pre-merge / main push: unit checks, two DuckLake E2E jobs, and Explorer UI E2E.
# Dev Cargo profile only (clippy + tests share one compile). Warm SLO ≤ 18m.
# Cache: ~/.cache/thelake via Make + actions/cache on registry + target.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DUCKDB_DOWNLOAD_LIB: "1"

jobs:
  ci:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      CARGO_INCREMENTAL: "0"
      ENFORCE_SLO: "1"

    steps:
      # Must stay inline and before checkout: root-owned warehouse/ blocks actions/checkout.
      - name: Pre-clean workspace permissions
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE:-$PWD}"
          if [[ -d "$WS" ]]; then
            sudo rm -rf "$WS/warehouse" || true
            sudo chown -R "$(id -u):$(id -g)" "$WS" || true
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Set up Node.js for the embedded Explorer
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/thelake-explorer/package-lock.json

      - name: Set up Go for thelake-collector
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: collector/go.sum

      - name: Restore build cache
        uses: ./.github/actions/thelake-cache

      - name: Bootstrap ubuntu runner
        uses: ./.github/actions/ubuntu-runner

      - name: Doctor
        run: make doctor

      - name: Start local test infra
        run: make setup

      - name: CI checks (fmt, lint, unit tests)
        run: |
          make check-fmt
          make lint
          make test

      - name: Teardown local infra
        if: always()
        run: make teardown

  e2e-isolated:
    name: E2E (isolated DuckLake)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      CARGO_INCREMENTAL: "0"
      ENFORCE_SLO: "1"
      WORKSPACE_SCOPE_MODE: isolated
      SPLAKE_RESET_DUCKLAKE: "1"

    steps:
      - name: Pre-clean workspace permissions
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE:-$PWD}"
          if [[ -d "$WS" ]]; then
            sudo rm -rf "$WS/warehouse" || true
            sudo chown -R "$(id -u):$(id -g)" "$WS" || true
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore build cache
        uses: ./.github/actions/thelake-cache

      - name: Bootstrap ubuntu runner
        uses: ./.github/actions/ubuntu-runner

      - name: Start local test infra
        run: make setup

      - name: Download pinned DuckLake extension
        run: make ducklake-extension

      - name: Run isolated DuckLake E2E suite
        run: |
          make ensure-cache
          make test-lease-pg
          ./scripts/run-isolated-cargo-tests.sh \
            --features integration-e2e \
            --test tests \
            --list-prefix integration::

      - name: Teardown local infra
        if: always()
        run: make teardown

  e2e-shared:
    name: E2E (shared DuckLake)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      CARGO_INCREMENTAL: "0"
      ENFORCE_SLO: "1"
      WORKSPACE_SCOPE_MODE: shared
      SPLAKE_RESET_DUCKLAKE: "1"

    steps:
      - name: Pre-clean workspace permissions
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE:-$PWD}"
          if [[ -d "$WS" ]]; then
            sudo rm -rf "$WS/warehouse" || true
            sudo chown -R "$(id -u):$(id -g)" "$WS" || true
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore build cache
        uses: ./.github/actions/thelake-cache

      - name: Bootstrap ubuntu runner
        uses: ./.github/actions/ubuntu-runner

      - name: Start local test infra
        run: make setup

      - name: Download pinned DuckLake extension
        run: make ducklake-extension

      - name: Run shared DuckLake E2E suite
        run: |
          make ensure-cache
          make test-lease-pg
          ./scripts/run-isolated-cargo-tests.sh \
            --features integration-e2e \
            --test tests \
            --list-prefix integration::

      - name: Teardown local infra
        if: always()
        run: make teardown

  e2e-explorer-ui:
    name: E2E (shared Explorer UI)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      ducklake-postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ducklake
          POSTGRES_USER: ducklake
          POSTGRES_DB: ducklake
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ducklake -d ducklake"
          --health-interval 2s
          --health-timeout 10s
          --health-retries 15
    env:
      CI: "true"
      CARGO_INCREMENTAL: "0"
      DUCKDB_DOWNLOAD_LIB: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/thelake-explorer/package-lock.json

      - name: Restore build cache
        uses: ./.github/actions/thelake-cache

      - name: Bootstrap ubuntu runner
        uses: ./.github/actions/ubuntu-runner

      - name: Run Explorer UI E2E
        run: make test-explorer-ui

  publish-ci-image:
    name: Build and publish GHCR CI images
    needs: ci
    if: >-
      github.repository == 'softprobe/thelake' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == 'softprobe/thelake')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    outputs:
      target_sha: ${{ steps.vars.outputs.target_sha }}
    env:
      CI: "true"
      CARGO_INCREMENTAL: "0"
      DUCKDB_DOWNLOAD_LIB: "1"

    steps:
      - name: Pre-clean workspace permissions
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE:-$PWD}"
          if [[ -d "$WS" ]]; then
            sudo rm -rf "$WS/warehouse" || true
            sudo chown -R "$(id -u):$(id -g)" "$WS" || true
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js for the embedded Explorer
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/thelake-explorer/package-lock.json

      - name: Set up Go for thelake-collector
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: collector/go.sum

      - name: Restore build cache
        uses: ./.github/actions/thelake-cache
        with:
          profile: release

      - name: Bootstrap ubuntu runner
        uses: ./.github/actions/ubuntu-runner

      - name: Doctor
        run: make doctor

      - name: Build TheLake release artifacts
        run: make build-release

      - name: Compute target SHA
        id: vars
        run: |
          full_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=7 HEAD)"
          {
            echo "target_sha=${full_sha}"
            echo "short_sha=${short_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract TheLake metadata
        id: meta_thelake
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=sha-${{ steps.vars.outputs.target_sha }}
            type=raw,value=sha-${{ steps.vars.outputs.short_sha }}
            type=ref,event=branch
            type=ref,event=pr

      - name: Extract collector metadata
        id: meta_collector
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-collector
          flavor: |
            latest=false
          tags: |
            type=raw,value=sha-${{ steps.vars.outputs.target_sha }}
            type=raw,value=sha-${{ steps.vars.outputs.short_sha }}
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and push TheLake CI image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta_thelake.outputs.tags }}
          labels: ${{ steps.meta_thelake.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max

      - name: Build and push collector CI image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./collector
          file: ./collector/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta_collector.outputs.tags }}
          labels: ${{ steps.meta_collector.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-collector:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-collector:buildcache,mode=max

      - name: Verify public unauthenticated GHCR pull
        env:
          THELAKE_REF: ghcr.io/${{ github.repository }}:sha-${{ steps.vars.outputs.target_sha }}
          COLLECTOR_REF: ghcr.io/${{ github.repository }}-collector:sha-${{ steps.vars.outputs.target_sha }}
        run: |
          tmp_docker_config="$(mktemp -d)"
          trap 'rm -rf "${tmp_docker_config}"' EXIT
          DOCKER_CONFIG="${tmp_docker_config}" docker manifest inspect "${THELAKE_REF}" >/dev/null
          DOCKER_CONFIG="${tmp_docker_config}" docker manifest inspect "${COLLECTOR_REF}" >/dev/null

  dispatch-system-e2e:
    name: Trigger Softprobe System E2E
    needs: publish-ci-image
    if: github.repository == 'softprobe/thelake'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Dispatch system-e2e workflow when org token is configured
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TARGET_SHA: ${{ needs.publish-ci-image.outputs.target_sha }}
          EXPLORER_BRANCH: ${{ github.head_ref }}
          DEV_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "GH_PAT secret is not configured; skipping cross-repo dispatch to private softprobe/dev."
            exit 0
          fi
          git_github() {
            local hdr
            hdr="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\r\n')"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${hdr}" "$@"
          }
          explorer_sha=""
          if [ -n "${EXPLORER_BRANCH}" ]; then
            explorer_sha="$(git_github ls-remote --heads \
              https://github.com/softprobe/explorer.git \
              "refs/heads/${EXPLORER_BRANCH}" | awk 'NR == 1 { print $1 }')"
          fi
          dev_ref=""
          if [ -n "${DEV_BRANCH}" ]; then
            dev_refs="$(git_github ls-remote --heads \
              https://github.com/softprobe/dev.git \
              "refs/heads/${DEV_BRANCH}")"
            if [ -n "${dev_refs}" ]; then
              dev_ref="${DEV_BRANCH}"
            fi
          fi
          dispatch_ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          dispatch_args=(--repo softprobe/dev -f override_repo=thelake -f "override_ref=sha-${TARGET_SHA}")
          if [ -n "${dev_ref}" ]; then
            echo "Dispatching system-e2e from matching dev branch ${dev_ref}"
            dispatch_args+=(--ref "${dev_ref}")
          else
            echo "No matching dev branch ${DEV_BRANCH}; dispatching from the default branch"
          fi
          if [ -n "${explorer_sha}" ]; then
            dispatch_args+=(-f "extra_overrides=explorer=${explorer_sha}")
          fi
          set +e
          dispatch_err="$(gh workflow run system-e2e.yml "${dispatch_args[@]}" 2>&1)"
          rc=$?
          set -e
          if [ "${rc}" -ne 0 ]; then
            if echo "${dispatch_err}" | grep -q "not in the list of allowed values"; then
              echo "softprobe/dev system-e2e.yml does not accept override_repo=thelake yet (tracked in softprobe/dev#258); skipping."
              exit 0
            fi
            echo "${dispatch_err}" >&2
            exit "${rc}"
          fi
          run_id=""
          for _ in $(seq 1 24); do
            sleep 5
            run_id="$(gh run list \
              --repo softprobe/dev \
              --workflow system-e2e.yml \
              --event workflow_dispatch \
              --limit 10 \
              --json databaseId,createdAt,displayTitle \
              --jq "[.[] | select(.createdAt >= \"${dispatch_ts}\")][0].databaseId // empty")"
            if [ -n "${run_id}" ]; then
              break
            fi
          done
          if [ -z "${run_id}" ]; then
            echo "Failed to locate dispatched system-e2e run on softprobe/dev." >&2
            exit 1
          fi
          gh run watch "${run_id}" --repo softprobe/dev --exit-status
