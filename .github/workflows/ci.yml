name: CI

# Pre-merge / main push: unit checks, two DuckLake E2E jobs, and Explorer UI E2E.
# Dev Cargo profile only (clippy + tests share one compile). Warm SLO ≤ 18m.
# Cache: ~/.cache/thelake via Make + actions/cache on registry + target.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DUCKDB_DOWNLOAD_LIB: "1"

jobs:
  ci:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      CARGO_INCREMENTAL: "0"
      ENFORCE_SLO: "1"

    steps:
      # Must stay inline and before checkout: root-owned warehouse/ blocks actions/checkout.
      - name: Pre-clean workspace permissions
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE:-$PWD}"
          if [[ -d "$WS" ]]; then
            sudo rm -rf "$WS/warehouse" || true
            sudo chown -R "$(id -u):$(id -g)" "$WS" || true
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Set up Node.js for the embedded Explorer
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: packages/thelake-explorer/package-lock.json

      - name: Restore build cache
        uses: ./.github/actions/thelake-cache

      - name: Bootstrap ubuntu runner
        uses: ./.github/actions/ubuntu-runner

      - name: Doctor
        run: make doctor

      - name: CI checks (fmt, lint, unit tests)
        run: |
          set -euo pipefail
          stack_json="$(python3 scripts/test_stack.py start-compose \
            --suite github-ci \
            --compose-file tests/compose.test.yaml \
            --service ducklake-postgres --service minio \
            --published-port ducklake-postgres:5432 --published-port minio:9000 --wait)"
          state_file="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["state_file"])' "$stack_json")"
          trap 'python3 scripts/test_stack.py stop --state-file "$state_file"' EXIT
          export THELAKE_TEST_POSTGRES_PORT="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["ports"]["ducklake-postgres:5432"][0].rsplit(":",1)[1])' "$stack_json")"
          export THELAKE_TEST_MINIO_ENDPOINT="http://$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["ports"]["minio:9000"][0])' "$stack_json")"
          echo "THELAKE_TEST_POSTGRES_PORT=$THELAKE_TEST_POSTGRES_PORT" >> "$GITHUB_ENV"
          echo "THELAKE_TEST_MINIO_ENDPOINT=$THELAKE_TEST_MINIO_ENDPOINT" >> "$GITHUB_ENV"
          python3 scripts/test_stack.py exec --state-file "$state_file" --service minio -- sh -ec 'mc alias set local http://localhost:9000 minioadmin minioadmin >/dev/null && mc mb --ignore-existing local/warehouse'
          make check-fmt
          make lint
          make _test

      - name: Upload test stack logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-stack-logs-ci
          path: target/test-artifacts/
          if-no-files-found: ignore

  e2e-isolated:
    name: E2E (isolated DuckLake)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      CARGO_INCREMENTAL: "0"
      ENFORCE_SLO: "1"
      WORKSPACE_SCOPE_MODE: isolated
      SPLAKE_RESET_DUCKLAKE: "1"

    steps:
      - name: Pre-clean workspace permissions
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE:-$PWD}"
          if [[ -d "$WS" ]]; then
            sudo rm -rf "$WS/warehouse" || true
            sudo chown -R "$(id -u):$(id -g)" "$WS" || true
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore build cache
        uses: ./.github/actions/thelake-cache

      - name: Bootstrap ubuntu runner
        uses: ./.github/actions/ubuntu-runner

      - name: Download pinned DuckLake extension
        run: make ducklake-extension

      - name: Run isolated DuckLake E2E suite
        run: |
          set -euo pipefail
          stack_json="$(python3 scripts/test_stack.py start-compose \
            --suite github-e2e-isolated \
            --compose-file tests/compose.test.yaml \
            --service ducklake-postgres --service minio \
            --published-port ducklake-postgres:5432 --published-port minio:9000 --wait)"
          state_file="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["state_file"])' "$stack_json")"
          trap 'python3 scripts/test_stack.py stop --state-file "$state_file"' EXIT
          export THELAKE_TEST_POSTGRES_PORT="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["ports"]["ducklake-postgres:5432"][0].rsplit(":",1)[1])' "$stack_json")"
          export THELAKE_TEST_MINIO_ENDPOINT="http://$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["ports"]["minio:9000"][0])' "$stack_json")"
          echo "THELAKE_TEST_POSTGRES_PORT=$THELAKE_TEST_POSTGRES_PORT" >> "$GITHUB_ENV"
          echo "THELAKE_TEST_MINIO_ENDPOINT=$THELAKE_TEST_MINIO_ENDPOINT" >> "$GITHUB_ENV"
          python3 scripts/test_stack.py exec --state-file "$state_file" --service minio -- sh -ec 'mc alias set local http://localhost:9000 minioadmin minioadmin >/dev/null && mc mb --ignore-existing local/warehouse'
          make ensure-cache
          make _test-lease-pg
          ./scripts/run-isolated-cargo-tests.sh \
            --features integration-e2e \
            --test tests \
            --list-prefix integration::

      - name: Upload test stack logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-stack-logs-e2e-isolated
          path: target/test-artifacts/
          if-no-files-found: ignore


  e2e-shared:
    name: E2E (shared DuckLake)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      CARGO_INCREMENTAL: "0"
      ENFORCE_SLO: "1"
      WORKSPACE_SCOPE_MODE: shared
      SPLAKE_RESET_DUCKLAKE: "1"

    steps:
      - name: Pre-clean workspace permissions
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE:-$PWD}"
          if [[ -d "$WS" ]]; then
            sudo rm -rf "$WS/warehouse" || true
            sudo chown -R "$(id -u):$(id -g)" "$WS" || true
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore build cache
        uses: ./.github/actions/thelake-cache

      - name: Bootstrap ubuntu runner
        uses: ./.github/actions/ubuntu-runner

      - name: Download pinned DuckLake extension
        run: make ducklake-extension

      - name: Run shared DuckLake E2E suite
        run: |
          set -euo pipefail
          stack_json="$(python3 scripts/test_stack.py start-compose \
            --suite github-e2e-shared \
            --compose-file tests/compose.test.yaml \
            --service ducklake-postgres --service minio \
            --published-port ducklake-postgres:5432 --published-port minio:9000 --wait)"
          state_file="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["state_file"])' "$stack_json")"
          trap 'python3 scripts/test_stack.py stop --state-file "$state_file"' EXIT
          export THELAKE_TEST_POSTGRES_PORT="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["ports"]["ducklake-postgres:5432"][0].rsplit(":",1)[1])' "$stack_json")"
          export THELAKE_TEST_MINIO_ENDPOINT="http://$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["ports"]["minio:9000"][0])' "$stack_json")"
          echo "THELAKE_TEST_POSTGRES_PORT=$THELAKE_TEST_POSTGRES_PORT" >> "$GITHUB_ENV"
          echo "THELAKE_TEST_MINIO_ENDPOINT=$THELAKE_TEST_MINIO_ENDPOINT" >> "$GITHUB_ENV"
          python3 scripts/test_stack.py exec --state-file "$state_file" --service minio -- sh -ec 'mc alias set local http://localhost:9000 minioadmin minioadmin >/dev/null && mc mb --ignore-existing local/warehouse'
          make ensure-cache
          make _test-lease-pg
          ./scripts/run-isolated-cargo-tests.sh \
            --features integration-e2e \
            --test tests \
            --list-prefix integration::

      - name: Upload test stack logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-stack-logs-e2e-shared
          path: target/test-artifacts/
          if-no-files-found: ignore


  e2e-explorer-ui:
    name: E2E (shared Explorer UI)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      CARGO_INCREMENTAL: "0"
      DUCKDB_DOWNLOAD_LIB: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: packages/thelake-explorer/package-lock.json

      - name: Restore build cache
        uses: ./.github/actions/thelake-cache

      - name: Bootstrap ubuntu runner
        uses: ./.github/actions/ubuntu-runner

      - name: Run Explorer UI E2E
        run: make test-explorer-ui

      - name: Upload test stack logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-stack-logs-explorer-ui
          path: target/test-artifacts/
          if-no-files-found: ignore
