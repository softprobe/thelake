services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ducklake
      POSTGRES_PASSWORD: ducklake
      POSTGRES_DB: ducklake
    ports:
      - "127.0.0.1:${THELAKE_QUICKSTART_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ducklake -d ducklake"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  evaluation-runner:
    build:
      context: ../../evaluation-runner
    environment:
      EVALUATION_RUNNER_TOKEN: ${THELAKE_EVALUATION_RUNNER_TOKEN:?quickstart script must set a runner token}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-${GEMINI_API_KEY:?Set GOOGLE_API_KEY or GEMINI_API_KEY before starting the quickstart}}
      USE_GEMINI_MODEL: "1"
      GEMINI_MODEL_NAME: ${GEMINI_MODEL_NAME:-gemini-2.5-flash}
    ports:
      - "127.0.0.1:${THELAKE_QUICKSTART_RUNNER_PORT:-18081}:8081"

  refund-agent:
    profiles: [demo-agent]
    network_mode: ${THELAKE_QUICKSTART_AGENT_NETWORK:-bridge}
    build:
      context: ./agent
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-${GEMINI_API_KEY:?Set GOOGLE_API_KEY or GEMINI_API_KEY before running the demo agent}}
      GEMINI_MODEL_NAME: ${GEMINI_MODEL_NAME:-gemini-2.5-flash}

volumes:
  postgres-data:
