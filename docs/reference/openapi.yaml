openapi: 3.1.0
info:
  title: thelake API
  version: 0.1.0
  description: |
    Authenticated HTTP API exposed by thelake. Interactive UI: `GET /swagger`
    (this document is also served as `GET /openapi.json`).

    This API accepts telemetry payloads on standard OTLP HTTP paths:
    - `POST /v1/traces`
    - `POST /v1/logs`

    It also documents the tenant-scoped schema promotion endpoint:
    - `POST /v1/promotions/apply`

    Evaluations are written through:
    - `POST /v1/scores`
    - `GET|POST /v1/score-configs`

    Query surfaces:
    - `POST /v1/traces/search`
    - `POST /v1/traces/details`
    - `POST /v1/spans/search`
    - `GET /v1/spans/{span_id}`
    - `GET /v1/traces/{trace_id}`
    - `POST /v1/sessions/search`
    - `POST /v1/sessions/details`
    - `POST /v1/sessions/summary/rebuild`
    - `GET /v1/sessions/{session_id}`
    - `GET /v1/sessions/{session_id}/recording`

    Control plane:
    - `POST /v1/workspaces` (admin bearer)
    - `GET /v1/meta`
    - `POST /v1/promotions/apply`
    - `GET /v1/data/ducklake-connection`

    Also inventoried here (summary-level): health/ready, `POST /v1/query/sql`,
    and `/v1/fields`. Loki/Tempo Grafana-compat query routes are served by
    the process but are not part of this product OpenAPI document.

    For JSON payloads, requests are expected to follow the OpenTelemetry collector export
    request shapes (`ExportTraceServiceRequest` and `ExportLogsServiceRequest`).

    Product metrics (`POST /v1/metrics`) are out of scope.

    For protobuf payloads, send binary OTLP with `Content-Type: application/x-protobuf`.

    Content type behavior mirrors implementation:
    - Any `Content-Type` containing `protobuf` is treated as protobuf.
    - All other content types (including missing header) are treated as JSON.
    - Default ingest is flush-through (`ingest.flush_interval_seconds: 0`): each
      accepted request is committed to the workspace DuckLake scope before ack.
    - Soft coalesce (`flush_interval_seconds` > 0) acks after enqueue; unflushed
      rows may be lost on crash or post-ack write failure.
    - Flush-through durable write failures return HTTP 503 so the exporter can retry.

    Canonical promotion contract (manifest YAML, lifecycle, failure modes):
    `docs/how-to/promotion.md`.
  externalDocs:
    description: Softprobe schema promotion guide
    url: https://github.com/softprobe/thelake/blob/main/docs/how-to/promotion.md
servers:
  - url: http://localhost:8090
    description: Local endpoint from default `config.yaml`
tags:
  - name: health
    description: Process health and readiness
  - name: ingestion
    description: OTLP ingestion endpoints
  - name: control
    description: Workspace provisioning and runtime metadata
  - name: promotion
    description: Workspace-scoped schema promotion
  - name: llm
    description: LLM observability records
  - name: query
    description: SQL and telemetry query surfaces
  - name: integrations
    description: External event and notification integrations
security:
  - bearerAuth: []
paths:
  /slack/events:
    post:
      tags: [integrations]
      summary: Receive Slack Events API callbacks
      description: |
        Slack verifies this endpoint using the configured signing secret. It
        accepts URL verification challenges and authorized evaluator commands
        from Slack event callbacks. This endpoint does not use bearer auth.
      operationId: receiveSlackEvent
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              additionalProperties: true
              description: Slack Events API envelope, signed over the raw body.
      responses:
        "200":
          description: Challenge response or event acknowledged
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Malformed Slack event envelope
        "401":
          description: Missing, stale, or invalid Slack request signature
        "403":
          description: Slack team or author is not authorized
        "503":
          description: Slack integration is unavailable; Slack may retry the event
  /health:
    get:
      tags: [health]
      summary: Health check
      operationId: healthCheck
      security: []
      responses:
        "200":
          description: Process is up
  /ready:
    get:
      tags: [health]
      summary: Readiness check
      operationId: readyCheck
      security: []
      responses:
        "200":
          description: Process is ready to serve traffic
  /v1/traces:
    post:
      tags:
        - ingestion
      summary: Ingest OTLP traces
      operationId: ingestTraces
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportTraceServiceRequest"
          application/x-protobuf:
            schema:
              type: string
              format: binary
              description: Protobuf-encoded `ExportTraceServiceRequest`
      responses:
        "200":
          description: Request accepted and processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
        "400":
          description: Invalid JSON/protobuf payload
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                invalidJson:
                  value: Invalid JSON
                invalidProtobuf:
                  value: Protobuf decode failed
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Bearer token could not be resolved to a tenant
        "413":
          description: Request exceeds `server.max_body_size`
        "503":
          $ref: "#/components/responses/IngestUnavailable"
  /v1/logs:
    post:
      tags:
        - ingestion
      summary: Ingest OTLP logs
      operationId: ingestLogs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportLogsServiceRequest"
          application/x-protobuf:
            schema:
              type: string
              format: binary
              description: Protobuf-encoded `ExportLogsServiceRequest`
      responses:
        "200":
          description: Request accepted and processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
        "400":
          description: Invalid JSON/protobuf payload
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                invalidJson:
                  value: "Invalid JSON: expected value at line 1 column 1"
                invalidProtobuf:
                  value: Protobuf decode failed
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Bearer token could not be resolved to a tenant
        "413":
          description: Request exceeds `server.max_body_size`
        "503":
          $ref: "#/components/responses/IngestUnavailable"
  /v1/scores:
    post:
      tags:
        - llm
      summary: Create an immutable LLM evaluation score
      description: |
        Creates a score in the authenticated tenant's DuckLake scope. Tenant
        identity is resolved from the bearer token and is never accepted in
        the request body.

        At least one target (`trace_id`, `span_id`, or `session_id`) is
        required. Exactly one value field must be present and must match
        `data_type`:

        - `numeric` uses `numeric_value`
        - `categorical` and `text` use `string_value`
        - `boolean` uses `boolean_value`

        `score_id` is the tenant-local idempotency key. Repeating a previously
        accepted ID does not append another score row.
      operationId: createScore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScoreRequest"
            examples:
              correctness:
                value:
                  score_id: score-01JZ8YH3KQBZ8V2CA9ZB1W7Q9A
                  timestamp: "2026-07-18T23:22:00Z"
                  trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
                  span_id: 00f067aa0ba902b7
                  name: correctness
                  data_type: numeric
                  numeric_value: 0.92
                  source: evaluator
                  comment: Answer is supported by the retrieved context.
                  metadata:
                    evaluator: groundedness-v2
      responses:
        "201":
          description: Score created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Score"
        "200":
          description: Idempotent retry; the score ID already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Score"
        "400":
          description: Missing target, missing value, or value does not match `data_type`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Bearer token could not be resolved to a tenant
        "422":
          description: Malformed JSON or field type mismatch
        "503":
          description: Tenant runtime, idempotency lookup, or DuckLake write unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/policies:
    get:
      tags: [llm]
      summary: List workspace and agent Markdown policy versions
      description: Returns workspace-scoped immutable Markdown policy versions.
      operationId: listPolicies
      responses:
        "200":
          description: Policy documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PolicyDocument"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Bearer token could not be resolved to a tenant
    post:
      tags: [llm]
      summary: Create an immutable Markdown policy version
      description: Stores workspace-wide or exact-agent policy content in the authenticated workspace.
      operationId: createPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePolicyRequest"
      responses:
        "201":
          description: Policy version created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyDocument"
        "200":
          description: Idempotent retry of the same policy version
        "400":
          description: Invalid policy or conflicting immutable version
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Bearer token could not be resolved to a tenant
  /v1/evaluators:
    get:
      tags: [llm]
      summary: List no-code behavior evaluators
      description: Returns versioned evaluator criteria stored in the authenticated workspace.
      operationId: listEvaluators
      responses:
        "200":
          description: Evaluator definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EvaluatorDefinition"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Bearer token could not be resolved to a tenant
    post:
      tags: [llm]
      summary: Create a draft no-code behavior evaluator version
      description: |
        Stores a natural-language criterion and optional ordered tool
        requirement for one named agent in the authenticated workspace. Drafts
        do not trigger evaluations. Explicit activation opts this evaluator
        into sending matching trace content to the configured judge provider.
      operationId: createEvaluator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEvaluatorRequest"
            examples:
              eligibilityBeforeRefund:
                value:
                  evaluator_id: refund-eligibility
                  version: 1
                  target_agent_name: support-agent
                  name: Refund eligibility before refund
                  criteria: Verify the agent checks refund eligibility and explains the result before issuing a refund.
                  threshold: 0.7
                  uncertainty_margin: 0.1
                  required_tool_order:
                    - before: check_eligibility
                      action: issue_refund
                      require_result_before_action: true
      responses:
        "201":
          description: Evaluator version created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluatorDefinition"
        "200":
          description: Idempotent retry of the same evaluator version
        "400":
          description: Invalid evaluator definition or conflicting config ID
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Bearer token could not be resolved to a tenant
  /v1/evaluators/{evaluator_id}/versions/{version}/activate:
    post:
      tags: [llm]
      summary: Activate an evaluator version for one agent
      description: |
        Activates this workspace-scoped evaluator for new matching traces. When
        the DeepEval runner is configured, captured prompt, completion, and
        tool data for the selected agent is sent to the configured Gemini
        provider. The runner applies a narrow credential redaction filter;
        this is not general PII scrubbing.
      operationId: activateEvaluator
      parameters:
        - name: evaluator_id
          in: path
          required: true
          schema: { type: string }
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Evaluator activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluatorDefinition"
        "400":
          description: Evaluator version not found
        "503":
          description: Online evaluation runner is not configured
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Bearer token could not be resolved to a tenant
  /v1/evaluators/{evaluator_id}/versions/{version}/deactivate:
    post:
      tags: [llm]
      summary: Stop evaluating new traces with this evaluator
      operationId: deactivateEvaluator
      parameters:
        - name: evaluator_id
          in: path
          required: true
          schema: { type: string }
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Evaluator deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluatorDefinition"
        "400":
          description: Evaluator version not found
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Bearer token could not be resolved to a tenant
  /v1/score-configs:
    get:
      tags:
        - llm
      summary: List score configs (seeds defaults when empty)
      description: |
        Returns append-only score schemas for the authenticated tenant. When the
        tenant has no configs yet, the server seeds built-in defaults
        (`correctness`, `quality`, `expected_output`) and returns them.
      operationId: listScoreConfigs
      responses:
        "200":
          description: Score config list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreConfigListResponse"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Bearer token could not be resolved to a tenant
        "503":
          description: Tenant runtime or DuckLake unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      tags:
        - llm
      summary: Create an append-only score config
      description: |
        Creates a score config in the authenticated tenant's DuckLake scope.
        `config_id` is the tenant-local idempotency key.
      operationId: createScoreConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScoreConfigRequest"
            examples:
              correctness:
                value:
                  config_id: cfg-correctness
                  timestamp: "2026-07-18T23:22:00Z"
                  name: correctness
                  data_type: boolean
                  description: Whether the turn was correct
                  author_id: system
      responses:
        "201":
          description: Score config created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreConfig"
        "200":
          description: Existing config returned after an idempotent retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreConfig"
        "400":
          description: Invalid score config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Bearer token could not be resolved to a tenant
        "503":
          description: Tenant runtime or DuckLake write unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/spans/search:
    post:
      tags:
        - llm
      summary: Search lightweight LLM span projections
      description: |
        Requires `from` and `to`. Returns lightweight span rows without
        full attributes/events. LLM fields are derived from span attributes
        (`gen_ai.*`, `sp.*`) and do not require promotion to be applied.
        Cursor ordering is `(timestamp DESC, span_id DESC)`.
      operationId: searchSpans
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpanSearchRequest"
      responses:
        "200":
          description: Bounded span page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpanSearchResponse"
        "400":
          description: Missing time range, invalid filter, or malformed cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Bearer token could not be resolved to a tenant
        "503":
          description: Tenant runtime or query unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/spans/{span_id}:
    get:
      tags:
        - llm
      summary: Get one span with full payload and attached scores
      operationId: getSpan
      parameters:
        - name: span_id
          in: path
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Span detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpanDetail"
        "404":
          description: Span not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid bearer token
        "503":
          description: Tenant runtime or query unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/traces/{trace_id}:
    get:
      tags:
        - llm
      summary: Get a trace, its spans, and scores
      operationId: getTrace
      parameters:
        - name: trace_id
          in: path
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Trace detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceDetail"
        "400":
          description: Invalid limit or cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Trace not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid bearer token
        "503":
          description: Tenant runtime or query unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/sessions/search:
    post:
      tags:
        - llm
      summary: Search sessions via session_summary
      description: |
        Always backed by Postgres `session_summary` (empty table → empty page).
        Requires `from` and `to`. Cursor paging is only defined for
        `order_by=start_time`; other orderings return a single ranked page and
        set `cursor_supported=false`.
      operationId: searchSessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionSearchRequest"
      responses:
        "200":
          description: Bounded session page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSearchResponse"
        "400":
          description: Missing time range, invalid filter, or malformed cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Bearer token could not be resolved to a tenant
        "503":
          description: session_summary or tenant runtime unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/sessions/summary/rebuild:
    post:
      tags:
        - llm
      summary: Rebuild session_summary for an explicit time window
      description: |
        Ops endpoint. Rejects inverted or oversized windows, acquires a
        per-tenant rebuild lease, then runs the shared lake aggregate → UPSERT
        path.
      operationId: rebuildSessionSummary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionSummaryRebuildRequest"
      responses:
        "200":
          description: Rebuild completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSummaryRebuildResponse"
        "400":
          description: Invalid or oversized rebuild window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid bearer token
        "503":
          description: Rebuild lease, lake aggregate, or UPSERT unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/sessions/{session_id}:
    get:
      tags:
        - llm
      summary: Get full session detail using the session summary time window
      description: |
        Does not accept query `from`/`to`. The lake window is taken from the
        tenant's `session_summary` row for `session_id`. Returns all session spans,
        trace and token totals, and scores in one response.
      operationId: getSession
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Complete session detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetail"
        "400":
          description: Invalid session ID or query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No session_summary row or no lake activity in the summary window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid bearer token
        "503":
          description: session_summary unavailable or tenant runtime unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/sessions/{session_id}/recording:
    get:
      tags:
        - llm
      summary: Get web session recording batches for a session
      operationId: getSessionRecording
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Ordered recording batches and flattened rrweb events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRecording"
        "400":
          description: Invalid limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No session_summary row for this session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid bearer token
        "503":
          description: session_summary unavailable or tenant runtime unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/traces/search:
    post:
      tags: [llm]
      summary: Search traces with a dynamic filter expression
      description: |
        Uses `TelemetrySearchRequest`: `version`, `scope` (`traces`), required
        nested `timeRange` (`from`/`to`), optional `filter` / `columns` / `sort` /
        `limit` / `cursor`. JSON fields are camelCase.
      operationId: searchTraces
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelemetrySearchRequest"
      responses:
        "200":
          description: Bounded trace search page
        "400":
          description: Missing timeRange, invalid filter, or malformed cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid bearer token
        "503":
          description: Workspace runtime or query unavailable
  /v1/traces/details:
    post:
      tags: [llm]
      summary: Fetch trace details by id with an explicit time window
      description: |
        Body must include `traceId` (or `target.id` with `kind: trace`) plus
        nested `timeRange`. JSON fields are camelCase.
      operationId: traceDetailsPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityDetailsRequest"
      responses:
        "200":
          description: Trace detail payload
        "400":
          description: Missing traceId or invalid timeRange
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid bearer token
        "503":
          description: Workspace runtime or query unavailable
  /v1/sessions/details:
    post:
      tags: [llm]
      summary: Fetch session details by id with an explicit time window
      description: |
        Body must include `sessionId` (or `target.id` with `kind: session`) plus
        nested `timeRange`. JSON fields are camelCase.
      operationId: sessionDetailsPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityDetailsRequest"
      responses:
        "200":
          description: Session detail payload
        "400":
          description: Missing sessionId or invalid timeRange
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid bearer token
        "503":
          description: Workspace runtime or query unavailable
  /v1/workspaces:
    post:
      tags: [control]
      summary: Provision a workspace DuckLake scope
      description: |
        Admin-only. Requires `Authorization: Bearer` matching
        `SOFTPROBE_ADMIN_API_KEY`. Body uses camelCase `workspaceId` and
        required `storageHints` (`ducklakeMetadataSchema`, `ducklakeDataPath`).
      operationId: provisionWorkspace
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspaceId, storageHints]
              properties:
                workspaceId:
                  type: string
                  format: uuid
                storageHints:
                  type: object
                  required: [ducklakeMetadataSchema, ducklakeDataPath]
                  properties:
                    ducklakeMetadataSchema:
                      type: string
                    ducklakeDataPath:
                      type: string
                    gcsBucket:
                      type: string
      responses:
        "200":
          description: Scope created or already exists with matching hints
        "400":
          description: Invalid workspace id, reserved id, or missing storage hints
        "401":
          description: Missing bearer token
        "403":
          description: Admin API key required
        "409":
          description: Workspace exists with a different storage scope
  /v1/meta:
    get:
      tags: [control]
      summary: Runtime and control-plane version metadata
      operationId: getMeta
      responses:
        "200":
          description: Version metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  runtimeVersion:
                    type: string
                  specVersion:
                    type: string
                  schemaVersion:
                    type: string
  /v1/promotions/apply:
    post:
      tags:
        - promotion
      summary: Apply a workspace-scoped promotion manifest
      description: |
        Parses a `softprobe.promotion.v1` YAML manifest, applies DuckLake schema
        changes for the authenticated tenant, and records the active spec in that
        tenant's metadata schema.

        Requirements and semantics:
        - Requires a PostgreSQL DuckLake catalog with a tenant scope registry.
        - Telemetry-column promotions extract values on subsequent OTLP ingest
          for that tenant. Historical rows are not backfilled.
        - Invalid JSON/type conversion during telemetry extraction fails the
          ingest batch. A corrupt active `promotion_specs` row can also block
          tenant ingest.
        - Business-table apply provisions `<table>_vN` + `<table>_current` and
          records the spec; automatic OTLP row materialization is not wired yet.
        - Full contract: `docs/how-to/promotion.md`.
      operationId: applyPromotion
      externalDocs:
        description: Canonical promotion guide
        url: https://github.com/softprobe/thelake/blob/main/docs/how-to/promotion.md
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromotionApplyRequest"
            examples:
              telemetryColumns:
                summary: Promote sp.user.id to traces.user_id
                value:
                  manifestYaml: |
                    specVersion: softprobe.promotion.v1
                    target:
                      kind: telemetry_columns
                      tables: [traces]
                    columns:
                      - name: user_id
                        type: string
                        nullable: true
                        source:
                          from: attribute
                          key: sp.user.id
              businessTable:
                summary: Provision a versioned business table
                value:
                  manifestYaml: |
                    specVersion: softprobe.promotion.v1
                    target:
                      kind: business_table
                      table: checkout_orders
                      version: 1
                    rowSelector:
                      attribute:
                        key: sp.workflow
                        equals: checkout
                    columns:
                      - name: order_id
                        type: string
                        nullable: false
                        source:
                          from: http_response_body
                          json_path: $.order.id
      responses:
        "200":
          description: Manifest validated and schema changes applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionApplyResponse"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Bearer token could not be resolved to a tenant
        "422":
          description: Invalid YAML or promotion validation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionErrorResponse"
              examples:
                notNullable:
                  value:
                    error:
                      code: telemetry_column_not_nullable
                      message: "telemetry_column_not_nullable at columns[0].nullable: telemetry promoted columns must be nullable"
        "503":
          description: |
            Tenant DuckLake registry/scope unavailable or schema apply/record
            failed. Possible `error.code` values:
            `ducklake_connection_unavailable`, `ducklake_scope_unavailable`,
            `promotion_schema_apply_failed`, `promotion_spec_record_failed`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionErrorResponse"
              examples:
                registryUnavailable:
                  value:
                    error:
                      code: ducklake_connection_unavailable
                      message: tenant DuckLake resolver is unavailable
                schemaApplyFailed:
                  value:
                    error:
                      code: promotion_schema_apply_failed
                      message: "DuckLake DDL failed: ..."
  /v1/query/sql:
    post:
      tags: [query]
      summary: Execute SQL query
      operationId: executeSql
      responses:
        "200":
          description: Query result
  /v1/fields:
    get:
      tags: [query]
      summary: List filterable fields
      operationId: listFields
      responses:
        "200":
          description: Field list
  /v1/fields/{field}/values:
    get:
      tags: [query]
      summary: List values for a field
      operationId: listFieldValues
      parameters:
        - name: field
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Field values
  /v1/data/ducklake-connection:
    get:
      tags: [query]
      summary: DuckLake setup material
      operationId: getDucklakeConnection
      responses:
        "200":
          description: Connection material for local DuckDB ATTACH
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    IngestUnavailable:
      description: DuckLake commit failed after backend retries; exporter should retry
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IngestResponse"
          example:
            success: false
            ingested_count: 0
            message: "Ingestion failed: DuckLake write failed"
  schemas:
    OrderedToolRequirement:
      type: object
      required: [before, action]
      properties:
        before:
          type: string
          maxLength: 256
        action:
          type: string
          maxLength: 256
        require_result_before_action:
          type: boolean
          default: true
    CreatePolicyRequest:
      type: object
      required: [policy_id, version, content]
      properties:
        policy_id:
          type: string
          maxLength: 200
          description: Stable policy ID, unique within its workspace.
        version:
          type: integer
          minimum: 1
        target_agent_name:
          type: string
          nullable: true
          maxLength: 256
          description: Exact agent name recorded on telemetry; omit for workspace-wide policy.
        content:
          type: string
          minLength: 1
          maxLength: 32000
          description: Human-readable Markdown POLICY.md content.
    PolicyDocument:
      allOf:
        - $ref: "#/components/schemas/CreatePolicyRequest"
        - type: object
          required: [timestamp]
          properties:
            timestamp:
              type: string
              format: date-time
    PolicySource:
      type: object
      required: [policy_id, policy_version, sha256]
      properties:
        policy_id:
          type: string
          maxLength: 256
          description: Identifier of the stored Markdown policy document.
        policy_version:
          type: integer
          minimum: 1
          description: Exact immutable version returned by GET /v1/policies.
        sha256:
          type: string
          pattern: "^[a-fA-F0-9]{64}$"
          description: SHA-256 digest verified against the stored document version.
        source_revision:
          type: string
          maxLength: 256
          nullable: true
    CreateEvaluatorRequest:
      type: object
      required: [evaluator_id, version, target_agent_name, name, criteria]
      properties:
        evaluator_id:
          type: string
          maxLength: 200
        version:
          type: integer
          minimum: 1
        target_agent_name:
          type: string
          maxLength: 256
        name:
          type: string
          maxLength: 200
        criteria:
          type: string
          maxLength: 8000
        threshold:
          type: number
          minimum: 0
          maximum: 1
          default: 0.7
        uncertainty_margin:
          type: number
          minimum: 0
          maximum: 0.49
          default: 0.1
        required_tool_order:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/OrderedToolRequirement"
        policy_sources:
          type: array
          maxItems: 20
          description: Optional, client-supplied provenance for criteria composed from policy memory.
          items:
            $ref: "#/components/schemas/PolicySource"
    EvaluatorDefinition:
      allOf:
        - $ref: "#/components/schemas/CreateEvaluatorRequest"
        - type: object
          required: [timestamp, active]
          properties:
            timestamp:
              type: string
              format: date-time
            active:
              type: boolean
    IngestResponse:
      type: object
      required:
        - success
        - ingested_count
        - message
      properties:
        success:
          type: boolean
          description: True when ingestion processing succeeded.
        ingested_count:
          type: integer
          minimum: 0
          description: Number of telemetry records successfully ingested.
        message:
          type: string
          description: Human-readable result details.
      examples:
        traces:
          value:
            success: true
            ingested_count: 128
            message: Successfully ingested 128 spans
    ErrorMessage:
      type: string
      description: Plain-text error body returned for malformed requests.
    ExportTraceServiceRequest:
      type: object
      description: |
        OTLP trace export request (JSON mapping).
        See OpenTelemetry protocol spec for the canonical schema.
      additionalProperties: true
    ExportLogsServiceRequest:
      type: object
      description: |
        OTLP logs export request (JSON mapping).
        See OpenTelemetry protocol spec for the canonical schema.
      additionalProperties: true
    CreateScoreRequest:
      type: object
      required:
        - score_id
        - timestamp
        - name
        - data_type
        - source
      description: |
        At least one target ID and exactly one value matching `data_type` are
        required. Tenant identity is intentionally absent.
      properties:
        score_id:
          type: string
          minLength: 1
        timestamp:
          type: string
          format: date-time
        trace_id:
          type: string
        span_id:
          type: string
        session_id:
          type: string
        name:
          type: string
          minLength: 1
        data_type:
          type: string
          enum: [numeric, categorical, boolean, text]
        numeric_value:
          type: number
        string_value:
          type: string
        boolean_value:
          type: boolean
        source:
          type: string
          enum: [api, user, evaluator, annotation]
        comment:
          type: string
        config_id:
          type: string
        author_id:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
          default: {}
    Score:
      allOf:
        - $ref: "#/components/schemas/CreateScoreRequest"
        - type: object
          required:
            - timestamp
          properties:
            timestamp:
              type: string
              format: date-time
    CreateScoreConfigRequest:
      type: object
      required:
        - config_id
        - timestamp
        - name
        - data_type
      description: |
        Append-only score schema used to validate scores that carry `config_id`.
        Tenant identity is intentionally absent.
      properties:
        config_id:
          type: string
          minLength: 1
        timestamp:
          type: string
          format: date-time
        name:
          type: string
          minLength: 1
        data_type:
          type: string
          enum: [numeric, categorical, boolean, text]
        description:
          type: string
          nullable: true
        min_value:
          type: number
          format: double
          nullable: true
        max_value:
          type: number
          format: double
          nullable: true
        categories:
          type: array
          items:
            type: string
          default: []
        author_id:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties:
            type: string
          default: {}
    ScoreConfig:
      allOf:
        - $ref: "#/components/schemas/CreateScoreConfigRequest"
        - type: object
          required:
            - timestamp
          properties:
            timestamp:
              type: string
              format: date-time
    ScoreConfigListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ScoreConfig"
    ApiError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    TelemetryTimeRange:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    TelemetrySearchRequest:
      type: object
      required: [version, scope, timeRange]
      properties:
        version:
          type: integer
          minimum: 1
        scope:
          type: string
          enum: [sessions, traces]
        timeRange:
          $ref: "#/components/schemas/TelemetryTimeRange"
        filter:
          description: Nested and/or filter expression over telemetry fields
          type: object
          additionalProperties: true
        columns:
          type: array
          items:
            type: string
        sort:
          type: array
          items:
            type: object
            additionalProperties: true
        limit:
          type: integer
          minimum: 1
        cursor:
          type: string
    EntityDetailsRequest:
      type: object
      required: [timeRange]
      properties:
        version:
          type: integer
          default: 1
        target:
          type: object
          required: [kind, id]
          properties:
            kind:
              type: string
            id:
              type: string
        traceId:
          type: string
        sessionId:
          type: string
        timeRange:
          $ref: "#/components/schemas/TelemetryTimeRange"
        limit:
          type: integer
          minimum: 1
    SpanSearchRequest:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        span_types:
          type: array
          items:
            type: string
            enum: [span, event, generation, agent, tool, chain, retriever, evaluator, embedding, guardrail]
        model_name:
          type: string
        user_id:
          type: string
        session_id:
          type: string
        trace_id:
          type: string
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        cursor:
          type: string
    SpanSummary:
      type: object
      required: [trace_id, span_id, name, span_type, start_time]
      properties:
        trace_id: { type: string }
        span_id: { type: string }
        parent_span_id: { type: string }
        session_id: { type: string }
        name: { type: string }
        span_type: { type: string }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        status_code: { type: string }
        model_name: { type: string }
        model_provider: { type: string }
        user_id: { type: string }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        total_tokens: { type: integer }
        total_cost: { type: number }
    SpanSearchResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SpanSummary"
        next_cursor:
          type: string
    SpanDetail:
      allOf:
        - $ref: "#/components/schemas/SpanSummary"
        - type: object
          required: [attributes, events]
          properties:
            attributes:
              type: object
              additionalProperties:
                type: string
            events:
              type: array
              items:
                type: object
            scores:
              type: array
              items:
                $ref: "#/components/schemas/Score"
    Trace:
      type: object
      required: [trace_id, start_time, end_time, span_count]
      properties:
        trace_id: { type: string }
        session_id: { type: string }
        name: { type: string }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        span_count: { type: integer }
        error_count: { type: integer }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        total_tokens: { type: integer }
        total_cost: { type: number }
        user_id: { type: string }
    TraceDetail:
      type: object
      required: [trace, spans, scores, next_span_cursor]
      properties:
        trace:
          $ref: "#/components/schemas/Trace"
        spans:
          type: array
          items:
            $ref: "#/components/schemas/SpanDetail"
        scores:
          type: array
          items:
            $ref: "#/components/schemas/Score"
        next_span_cursor:
          type: [string, "null"]
    SessionDetail:
      type: object
      required: [session_id, from, to, trace_count, span_count, spans, scores]
      properties:
        session_id: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        trace_count: { type: integer }
        span_count: { type: integer }
        user_ids:
          type: array
          items:
            type: string
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        total_tokens: { type: integer }
        total_cost: { type: number }
        spans:
          type: array
          description: All detailed spans in the session, ordered newest first
          items:
            $ref: "#/components/schemas/SpanDetail"
        scores:
          type: array
          items:
            $ref: "#/components/schemas/Score"
    SessionSearchRequest:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        has_errors:
          type: boolean
        user_id:
          type: string
        model_name:
          type: string
        agent_name:
          type: string
        roots_only:
          type: boolean
          default: true
        order_by:
          type: string
          enum: [start_time, error_count, duration, total_tokens, total_cost]
          default: start_time
        order:
          type: string
          enum: [asc, desc]
          default: desc
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        cursor:
          type: string
    SessionSummary:
      type: object
      required: [session_id, start_time, trace_count, span_count, error_count, user_ids, models]
      properties:
        session_id: { type: string }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        trace_count: { type: integer }
        span_count: { type: integer }
        error_count: { type: integer }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        total_tokens: { type: integer }
        total_cost: { type: number }
        agent_name: { type: string }
        user_ids:
          type: array
          items:
            type: string
        models:
          type: array
          items:
            type: string
    SessionSearchResponse:
      type: object
      required: [items, cursor_supported]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SessionSummary"
        next_cursor:
          type: string
        cursor_supported:
          type: boolean
    SessionSummaryRebuildRequest:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    SessionSummaryRebuildResponse:
      type: object
      required: [sessions_upserted]
      properties:
        sessions_upserted:
          type: integer
          minimum: 0
    SessionRecording:
      type: object
      required: [session_id, from, to, batches, events]
      properties:
        session_id: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        batches:
          type: array
          items:
            $ref: "#/components/schemas/RecordingBatch"
        events:
          type: array
          description: Flattened rrweb events sorted by timestamp
          items:
            type: object
    RecordingBatch:
      type: object
      required: [span_id, trace_id, start_time, events]
      properties:
        span_id: { type: string }
        trace_id: { type: string }
        start_time: { type: string, format: date-time }
        batch_index: { type: integer }
        attributes:
          type: object
          additionalProperties:
            type: string
        events:
          type: array
          items:
            type: object
    PromotionApplyRequest:
      type: object
      required:
        - manifestYaml
      properties:
        manifestYaml:
          type: string
          description: |
            YAML document with `specVersion: softprobe.promotion.v1`.
            See `docs/how-to/promotion.md` for the full manifest contract.
    PromotionApplyResponse:
      type: object
      required:
        - specVersion
        - applied
        - target
        - schemaChanges
      properties:
        specVersion:
          type: string
          const: softprobe.promotion.apply.v1
        applied:
          type: boolean
        target:
          type: object
          additionalProperties: true
          description: Applied target summary (`telemetry_columns` or `business_table`).
        schemaChanges:
          type: array
          items:
            type: object
            additionalProperties: true
    PromotionErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
