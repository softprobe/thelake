# Canonical Rolling mocker promotion for Softprobe replay storage.
# Apply via POST /v1/promotions/apply before ingest so typed columns fill.
# When LLM observations share the same tenant, merge with llm-v1.yaml via
# merge_telemetry_columns_manifests before apply (one active telemetry spec).
specVersion: softprobe.promotion.v1
target:
  kind: telemetry_columns
  tables: [traces]
columns:
  - name: record_category
    type: string
    nullable: true
    source:
      from: attribute
      key: sp_category_type
  - name: record_operation
    type: string
    nullable: true
    source:
      from: attribute
      key: sp_operation_name
  - name: record_id
    type: string
    nullable: true
    source:
      from: attribute
      key: sp_record_id
  - name: record_env
    type: int64
    nullable: true
    source:
      from: attribute
      key: sp_record_environment
  - name: record_version
    type: string
    nullable: true
    source:
      from: attribute
      key: sp_record_version
  - name: record_creation_time
    type: int64
    nullable: true
    source:
      from: attribute
      key: sp_creation_time
  - name: record_replay_id
    type: string
    nullable: true
    source:
      from: attribute
      key: sp_replay_id
  - name: record_transaction_id
    type: string
    nullable: true
    source:
      from: attribute
      key: sp_transaction_id
  - name: record_deleted
    type: bool
    nullable: true
    source:
      from: attribute
      key: sp_record_deleted
  - name: record_expiration_time
    type: timestamp
    nullable: true
    source:
      from: attribute
      key: sp_expiration_time
  - name: record_ghost
    type: bool
    nullable: true
    source:
      from: attribute
      key: sp_record_ghost
