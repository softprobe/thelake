openapi: 3.1.0
info:
  title: Softprobe LLM API
  version: 0.1.0
  description: |
    LLM-specific score and query extensions for thelake.

    Tenant identity is resolved from the bearer token and is never accepted in
    request bodies. List and aggregate surfaces require an explicit time range.
    Observation and trace detail endpoints may omit the time range when looking
    up an exact identifier.

    Cursor pagination uses deterministic ordering `(timestamp DESC, id DESC)`
    and encodes the last row as URL-safe base64 JSON.
servers:
  - url: http://localhost:8090
security:
  - bearerAuth: []
tags:
  - name: scores
    description: Immutable evaluation scores
  - name: observations
    description: LLM observation list and detail
  - name: traces
    description: Trace summaries derived from spans
  - name: sessions
    description: Session summaries over bounded time ranges
  - name: debug-query
    description: Internal/debug read-only query access
paths:
  /v1/llm/scores:
    post:
      tags: [scores]
      operationId: createScore
      summary: Create an immutable evaluation score
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScoreRequest"
      responses:
        "201":
          description: Score created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Score"
        "200":
          description: Existing score returned after an idempotent retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Score"
        "400":
          description: Invalid score target or value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Invalid bearer token
        "403":
          description: Bearer token could not be resolved to a tenant
        "503":
          description: Tenant runtime or DuckLake write unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/llm/observations/search:
    post:
      tags: [observations]
      operationId: searchObservations
      summary: Search lightweight observation projections
      description: |
        Requires `from` and `to`. Returns lightweight observation rows without
        full attributes/events. LLM fields are derived from span attributes
        (`gen_ai.*`, `sp.*`) and do not require promotion to be applied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObservationSearchRequest"
      responses:
        "200":
          description: Bounded observation page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservationSearchResponse"
        "400":
          description: Missing time range, invalid filter, or malformed cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Invalid bearer token
        "403":
          description: Bearer token could not be resolved to a tenant
        "503":
          description: Tenant runtime or query unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/llm/observations/{span_id}:
    get:
      tags: [observations]
      operationId: getObservation
      summary: Get one observation with full payload and attached scores
      parameters:
        - name: span_id
          in: path
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Observation detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservationDetail"
        "404":
          description: Observation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Invalid bearer token
        "503":
          description: Tenant runtime or query unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/llm/traces/{trace_id}:
    get:
      tags: [traces]
      operationId: getTrace
      summary: Get a derived trace summary, observations, and scores
      parameters:
        - name: trace_id
          in: path
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Trace detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceDetail"
        "404":
          description: Trace not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          description: Invalid limit or cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Invalid bearer token
        "503":
          description: Tenant runtime or query unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/llm/sessions/search:
    post:
      tags: [sessions]
      operationId: searchSessions
      summary: Search sessions within a bounded time range
      description: >
        Returns sessions aggregated server-side. Clients must not assemble a
        session list by paging /v1/llm/observations/search and grouping in
        memory: that makes paging observation-level (one session is split
        across pages), limits ordering to the rows already fetched, and turns
        every aggregate into a per-page partial sum.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionSearchRequest"
      responses:
        "200":
          description: Matching sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSearchResponse"
        "400":
          description: Invalid range, or a cursor combined with an ordering it does not apply to
        "401":
          description: Invalid bearer token

  /v1/llm/sessions/{session_id}:
    get:
      tags: [sessions]
      operationId: getSession
      summary: Get a time-bounded session summary
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Session summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetail"
        "400":
          description: Missing time range, invalid limit, or malformed cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No session activity in the requested range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Invalid bearer token
        "503":
          description: Tenant runtime or query unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/query/sql:
    post:
      tags: [debug-query]
      operationId: executeReadOnlySql
      summary: Execute an internal/debug read-only SQL query
      description: |
        Internal debugging surface. Clients documented by this specification
        MUST submit bounded SELECT statements only. Agent skills use fixed
        SELECT templates and never pass through arbitrary user SQL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SqlQueryRequest"
      responses:
        "200":
          description: Tabular query result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SqlQueryResponse"
        "400":
          description: Empty or invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Invalid bearer token
        "500":
          description: Query execution failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string
    SqlQueryRequest:
      type: object
      required: [sql]
      properties:
        sql:
          type: string
          minLength: 1
          description: A bounded read-only SELECT statement
    SqlQueryResponse:
      type: object
      required: [columns, rows, row_count]
      properties:
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: array
            items: {}
        row_count:
          type: integer
          minimum: 0
    CreateScoreRequest:
      type: object
      required: [score_id, timestamp, name, data_type, source]
      properties:
        score_id:
          type: string
          minLength: 1
        timestamp:
          type: string
          format: date-time
        trace_id:
          type: [string, "null"]
        span_id:
          type: [string, "null"]
        session_id:
          type: [string, "null"]
        name:
          type: string
          minLength: 1
        data_type:
          type: string
          enum: [numeric, categorical, boolean, text]
        numeric_value:
          type: [number, "null"]
        string_value:
          type: [string, "null"]
        boolean_value:
          type: [boolean, "null"]
        source:
          type: string
          enum: [api, user, evaluator, annotation]
        comment:
          type: [string, "null"]
        config_id:
          type: [string, "null"]
        author_id:
          type: [string, "null"]
        metadata:
          type: object
          additionalProperties:
            type: string
          default: {}
    Score:
      allOf:
        - $ref: "#/components/schemas/CreateScoreRequest"
        - type: object
          required: [record_date]
          properties:
            record_date:
              type: string
              format: date
    ObservationSearchRequest:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        observation_types:
          type: array
          items:
            $ref: "#/components/schemas/ObservationType"
        model_name:
          type: string
        user_id:
          type: string
        session_id:
          type: string
        trace_id:
          type: string
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        cursor:
          type: string
          description: Opaque cursor from a previous response
    ObservationType:
      type: string
      enum:
        - span
        - event
        - generation
        - agent
        - tool
        - chain
        - retriever
        - evaluator
        - embedding
        - guardrail
    ObservationSummary:
      type: object
      required:
        - trace_id
        - span_id
        - name
        - observation_type
        - start_time
      properties:
        trace_id:
          type: string
        span_id:
          type: string
        parent_span_id:
          type: [string, "null"]
        session_id:
          type: [string, "null"]
        name:
          type: string
        observation_type:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: [string, "null"]
          format: date-time
        status_code:
          type: [string, "null"]
        model_name:
          type: [string, "null"]
        model_provider:
          type: [string, "null"]
        user_id:
          type: [string, "null"]
        input_tokens:
          type: [integer, "null"]
        output_tokens:
          type: [integer, "null"]
        total_tokens:
          type: [integer, "null"]
        total_cost:
          type: [number, "null"]
    ObservationSearchResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ObservationSummary"
        next_cursor:
          type: [string, "null"]
    ObservationDetail:
      allOf:
        - $ref: "#/components/schemas/ObservationSummary"
        - type: object
          properties:
            attributes:
              type: object
              additionalProperties:
                type: string
            events:
              type: array
              items:
                type: object
                additionalProperties: true
            scores:
              type: array
              items:
                $ref: "#/components/schemas/Score"
    TraceSummary:
      type: object
      required: [trace_id, start_time, end_time, observation_count]
      properties:
        trace_id:
          type: string
        session_id:
          type: [string, "null"]
        name:
          type: [string, "null"]
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        observation_count:
          type: integer
        error_count:
          type: integer
        input_tokens:
          type: [integer, "null"]
        output_tokens:
          type: [integer, "null"]
        total_tokens:
          type: [integer, "null"]
        total_cost:
          type: [number, "null"]
        user_id:
          type: [string, "null"]
    TraceDetail:
      type: object
      required: [trace, observations, scores]
      properties:
        trace:
          $ref: "#/components/schemas/TraceSummary"
        observations:
          type: array
          items:
            $ref: "#/components/schemas/ObservationDetail"
        scores:
          type: array
          items:
            $ref: "#/components/schemas/Score"
        next_cursor:
          type: [string, "null"]
    SessionSearchRequest:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        has_errors:
          type: [boolean, "null"]
          description: >
            true keeps only sessions containing at least one ERROR span,
            false keeps only sessions with none. Omit for no status filter.
        user_id:
          type: [string, "null"]
        model_name:
          type: [string, "null"]
        order_by:
          type: string
          enum: [start_time, error_count, duration, total_tokens, total_cost]
          default: start_time
        order:
          type: string
          enum: [asc, desc]
          default: desc
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        cursor:
          type: [string, "null"]
          description: >
            Only valid with order_by=start_time — the cursor encodes
            (start_time, session_id). Supplying it under another ordering is
            a 400 rather than a page that silently overlaps or skips rows.
    SessionSearchResponse:
      type: object
      required: [items, cursor_supported]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SessionListItem"
        next_cursor:
          type: [string, "null"]
        cursor_supported:
          type: boolean
          description: >
            False for every ordering other than start_time. Distinguishes
            "this ordering returns a single ranked page" from "no more data".
    SessionListItem:
      type: object
      required:
        [session_id, start_time, trace_count, observation_count, error_count]
      properties:
        session_id:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: [string, "null"]
          format: date-time
        trace_count:
          type: integer
        observation_count:
          type: integer
        error_count:
          type: integer
        input_tokens:
          type: [integer, "null"]
        output_tokens:
          type: [integer, "null"]
        total_tokens:
          type: [integer, "null"]
        total_cost:
          type: [number, "null"]
        agent_name:
          type: [string, "null"]
          description: Name of the earliest span whose sp.observation.type is `agent`.
        user_ids:
          type: array
          items:
            type: string
        models:
          type: array
          items:
            type: string
    SessionDetail:
      type: object
      required: [session_id, from, to, trace_count, observation_count, traces, scores]
      properties:
        session_id:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        trace_count:
          type: integer
        observation_count:
          type: integer
        user_ids:
          type: array
          items:
            type: string
        input_tokens:
          type: [integer, "null"]
        output_tokens:
          type: [integer, "null"]
        total_tokens:
          type: [integer, "null"]
        total_cost:
          type: [number, "null"]
        traces:
          type: array
          items:
            $ref: "#/components/schemas/TraceSummary"
        scores:
          type: array
          items:
            $ref: "#/components/schemas/Score"
        next_cursor:
          type: [string, "null"]
