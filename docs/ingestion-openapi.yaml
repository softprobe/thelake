    CreateScoreRequest:
      type: object
      required:
        - score_id
        - timestamp
        - name
        - data_type
        - source
      description: |
        At least one target ID and exactly one value matching `data_type` are
        required. Tenant identity is intentionally absent.
      properties:
        score_id:
          type: string
          minLength: 1
        timestamp:
          type: string
          format: date-time
        trace_id:
          type: string
        span_id:
          type: string
        session_id:
          type: string
        name:
          type: string
          minLength: 1
        data_type:
          type: string
          enum: [numeric, categorical, boolean, text]
        numeric_value:
          type: number
        string_value:
          type: string
        boolean_value:
          type: boolean
        source:
          type: string
          enum: [api, user, evaluator, annotation]
        comment:
          type: string
        config_id:
          type: string
        author_id:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
          default: {}
    Score:
      allOf:
        - $ref: "#/components/schemas/CreateScoreRequest"
        - type: object
          required:
            - timestamp
          properties:
            timestamp:
              type: string
              format: date-time
    CreateScoreConfigRequest:
      type: object
      required:
        - config_id
        - timestamp
        - name
        - data_type
      description: |
        Append-only score schema used to validate scores that carry `config_id`.
        Tenant identity is intentionally absent.
      properties:
        config_id:
          type: string
          minLength: 1
        timestamp:
          type: string
          format: date-time
        name:
          type: string
          minLength: 1
        data_type:
          type: string
          enum: [numeric, categorical, boolean, text]
        description:
          type: string
          nullable: true
        min_value:
          type: number
          format: double
          nullable: true
        max_value:
          type: number
          format: double
          nullable: true
        categories:
          type: array
          items:
            type: string
          default: []
        author_id:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties:
            type: string
          default: {}
    ScoreConfig:
