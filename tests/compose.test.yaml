# Docker services used by automated tests. scripts/test_stack.py owns startup,
# unique project names, artifact collection, and teardown for every test run.
services:
  ducklake-postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ducklake
      POSTGRES_PASSWORD: ducklake
      POSTGRES_DB: ducklake
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ducklake -d ducklake"]
      interval: 1s
      timeout: 2s
      retries: 30
    volumes:
      - ducklake-test-postgres:/var/lib/postgresql

  minio:
    image: pgsty/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DOMAIN: minio
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 1s
      timeout: 2s
      retries: 30
    volumes:
      - ducklake-test-minio:/data

  lisa-postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: lisa_test
      POSTGRES_PASSWORD: lisa_test
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lisa_test -d postgres"]
      interval: 200ms
      timeout: 2s
      retries: 50

volumes:
  ducklake-test-postgres:
  ducklake-test-minio:
