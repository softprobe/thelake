#
# Softprobe demo overlay — full-fidelity Astronomy Shop → Softprobe.
#
# Strategy (CPU via pacing, not dropping product metrics/logs):
# - Send full application metrics (no name allow-list). Keep memory limiter +
#   timeout-dominated batch so Softprobe sees paced posts, not a firehose.
# - Send application logs to Softprobe (coalesced on Softprobe side).
# - Send traces to Softprobe with probabilistic sampling (default 10%) so Tempo
#   boards stay online without span storms — metrics+logs stay complete.
# - Receivers stay Astronomy Shop + k6 + ad scrape + span_metrics (not
#   docker_stats / host_metrics / redis / postgres collectors — those are
#   infra noise, not shop dashboards).
# - Pair with grafana-manual-up.sh: coalesce flush, query pool ≥2, self-mon on.

processors:
  # Application logs only — skip collector/docker noise that drowns DuckLake.
  filter/softprobe_app_logs:
    error_mode: ignore
    logs:
      log_record:
        - 'not IsMatch(resource.attributes["service.name"], "(?i)^(ad|cart|checkout|currency|email|fraud-detection|frontend|frontend-proxy|payment|product-catalog|quote|recommendation|shipping|accounting|flagd|load-generator)$")'
  # Keep metrics+logs complete; sample traces only (plan fallback if CPU tight).
  probabilistic_sampler:
    sampling_percentage: 5
  batch/softprobe:
    # Timeout-dominated pacing: Softprobe coalesce + Grafana refresh=10s.
    # Keep well under the stop-gate ingest recovery budget (flush≈60s + retries):
    # 120s batch + 60s coalesce left post-measure checks staring at stale PromQL.
    timeout: 30s
    send_batch_size: 8192
    send_batch_max_size: 8192
  memory_limiter/softprobe:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

exporters:
  otlphttp/softprobe:
    endpoint: http://host.docker.internal:8090
    tls:
      insecure: true
    timeout: 90s
    compression: gzip
    headers:
      Authorization: "Bearer local-dev-key"
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 15s
      max_elapsed_time: 180s
    sending_queue:
      enabled: true
      # Pace Softprobe writers; raise only if coalesce backlog stays empty.
      num_consumers: 1
      queue_size: 64

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors:
        [
          resourcedetection,
          memory_limiter/softprobe,
          transform/sanitize_spans,
          gen_ai_normalizer,
          probabilistic_sampler,
          batch/softprobe,
        ]
      exporters: [debug, span_metrics, otlphttp/softprobe]
    metrics:
      receivers: [otlp, prometheus/ad, span_metrics]
      processors:
        [
          resourcedetection,
          memory_limiter/softprobe,
          batch/softprobe,
        ]
      exporters: [debug, otlphttp/softprobe]
    logs:
      receivers: [otlp]
      processors:
        [
          resourcedetection,
          memory_limiter/softprobe,
          transform/sanitize_logs,
          filter/softprobe_app_logs,
          batch/softprobe,
        ]
      exporters: [debug, otlphttp/softprobe]
