#
# Softprobe demo overlay. Target: Softprobe process CPU < 100% under Grafana
# dashboards with refresh=10s (softprobe-prom-overview and siblings).
#
# Strategy:
# - Allow-list overview series (k6 vus/iterations/http_reqs + demo_ad). Drop
#   k6.http.req.* latency histograms and demo_cart histograms (~800 pts/10s).
# - Pace OTLP on the 10s refresh cadence (timeout-dominated batch).
# - Do not send logs/traces or span_metrics-derived series to Softprobe.
# - Pair with grafana-manual-up.sh: worker_threads=1, max_connections=1,
#   CPU affinity, self-mon off; H-04/Loki waits skipped unless
#   THELAKE_REQUIRE_FULL_OTLP=1.

processors:
  filter/softprobe_gold:
    error_mode: ignore
    metrics:
      metric:
        # Overview GOLD: k6 vus/iterations/http_reqs + ad counter. OTLP uses dotted
        # names (k6.vus). Exclude k6.http.req.* latency histograms and demo_cart
        # histograms (~800 points/10s) that peg DuckLake write on one core.
        - 'not IsMatch(name, "(?i)^(k6[_\\.]vus|k6[_\\.]iterations|k6[_\\.]vus[_\\.]max|k6[_\\.]http[_\\.]reqs$|http_reqs$|iterations$|vus$|demo[_\\.]ad[_\\.]served)")'
  batch/softprobe:
    # Timeout-dominated: large size so Softprobe sees ~1 metrics POST / 10s, not
    # a continuous 256-point firehose while the load generator is running.
    timeout: 10s
    send_batch_size: 8192
    send_batch_max_size: 8192
  memory_limiter/softprobe:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

exporters:
  otlphttp/softprobe:
    endpoint: http://host.docker.internal:8090
    tls:
      insecure: true
    timeout: 60s
    compression: gzip
    headers:
      Authorization: "Bearer local-dev-key"
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 15s
      max_elapsed_time: 180s
    sending_queue:
      enabled: true
      num_consumers: 1
      queue_size: 8

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors:
        [
          resourcedetection,
          memory_limiter,
          transform/sanitize_spans,
          gen_ai_normalizer,
        ]
      # No Softprobe / span_metrics — Prom GOLD boards are metrics-only.
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors:
        [
          resourcedetection,
          memory_limiter/softprobe,
          filter/softprobe_gold,
          batch/softprobe,
        ]
      exporters: [debug, otlphttp/softprobe]
    logs:
      receivers: [otlp]
      processors:
        [
          resourcedetection,
          memory_limiter/softprobe,
          transform/sanitize_logs,
        ]
      # Logs are not queried by Prom GOLD boards; skip Softprobe to save CPU.
      exporters: [debug]
