#
# Softprobe demo overlay — Astronomy Shop logs + sampled traces → Softprobe.
#
# Strategy (CPU via MAP bags + coalesce + pacing, not dropping product signals):
# - Do not send customer metrics to Softprobe (product metrics signal removed).
# - Send application logs to Softprobe (coalesced on Softprobe side).
# - Send traces to Softprobe with probabilistic sampling so Tempo boards stay
#   online without span storms.
# - Receivers stay Astronomy Shop + k6 + ad scrape + span_metrics for local
#   collector debug only — metrics exporters target `debug`, not Softprobe.
# - Pair with grafana-manual-up.sh: coalesce flush, worker_threads=1,
#   one-core affinity, product-hot promotions applied.

processors:
  # Application logs only — skip collector/docker noise that drowns DuckLake.
  filter/softprobe_app_logs:
    error_mode: ignore
    logs:
      log_record:
        - 'not IsMatch(resource.attributes["service.name"], "(?i)^(ad|cart|checkout|currency|email|fraud-detection|frontend|frontend-proxy|payment|product-catalog|quote|recommendation|shipping|accounting|flagd|load-generator)$")'
  # Sample traces only; logs stay complete.
  probabilistic_sampler:
    sampling_percentage: 5
  batch/softprobe:
    # Timeout-dominated pacing: Softprobe coalesce + Grafana refresh=10s.
    timeout: 60s
    send_batch_size: 8192
    send_batch_max_size: 8192
  memory_limiter/softprobe:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

exporters:
  otlphttp/softprobe:
    endpoint: http://host.docker.internal:8090
    tls:
      insecure: true
    timeout: 90s
    compression: gzip
    headers:
      Authorization: "Bearer local-dev-key"
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 15s
      max_elapsed_time: 180s
    sending_queue:
      enabled: true
      num_consumers: 1
      queue_size: 64

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors:
        [
          resourcedetection,
          memory_limiter/softprobe,
          transform/sanitize_spans,
          gen_ai_normalizer,
          probabilistic_sampler,
          batch/softprobe,
        ]
      exporters: [debug, span_metrics, otlphttp/softprobe]
    metrics:
      receivers: [otlp, prometheus/ad, span_metrics]
      processors:
        [
          resourcedetection,
          memory_limiter/softprobe,
          batch/softprobe,
        ]
      # Local collector debug only — Softprobe no longer accepts /v1/metrics.
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors:
        [
          resourcedetection,
          memory_limiter/softprobe,
          transform/sanitize_logs,
          filter/softprobe_app_logs,
          batch/softprobe,
        ]
      exporters: [debug, otlphttp/softprobe]
