#
# Softprobe demo overlay for Astronomy Shop.
#
# Softprobe runs with worker_threads=1. Drop span_metrics connector series and
# infra scrapes; use a single OTLP/HTTP consumer so Softprobe is not flooded by
# parallel exporters. Remaining http_/rpc_/k6 volume is still ~one core of useful
# work — Softprobe code fixes remove multi-core waste (DuckDB nproc pools,
# coalesce tight-loop drains, self-mon inventory storms).

processors:
  filter/softprobe_gold:
    error_mode: ignore
    metrics:
      metric:
        - 'not IsMatch(name, "(?i)^(k6[_\\.]|demo[_\\.]|http\\.|http_|rpc\\.|rpc_|http_reqs$|http_req_|iterations$|vus$|data_sent$|data_received$)")'
  filter/softprobe_gold_logs:
    error_mode: ignore
    logs:
      log_record:
        - 'not IsMatch(resource.attributes["service.name"], "(?i)^(ad|cart|checkout|currency|email|fraud-detection|frontend|frontend-proxy|payment|product-catalog|quote|recommendation|shipping|accounting|flagd|load-generator)$")'
  batch/softprobe:
    timeout: 5s
    send_batch_size: 256
    send_batch_max_size: 256
  memory_limiter/softprobe:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

exporters:
  otlphttp/softprobe:
    endpoint: http://host.docker.internal:8090
    tls:
      insecure: true
    timeout: 60s
    compression: gzip
    headers:
      Authorization: "Bearer local-dev-key"
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 15s
      max_elapsed_time: 180s
    sending_queue:
      enabled: true
      num_consumers: 1
      queue_size: 256

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors:
        [
          resourcedetection,
          memory_limiter,
          transform/sanitize_spans,
          gen_ai_normalizer,
        ]
      exporters: [debug, span_metrics]
    metrics:
      receivers: [otlp, span_metrics]
      processors:
        [
          resourcedetection,
          memory_limiter/softprobe,
          filter/softprobe_gold,
          batch/softprobe,
        ]
      exporters: [debug, otlphttp/softprobe]
    logs:
      receivers: [otlp]
      processors:
        [
          resourcedetection,
          memory_limiter/softprobe,
          transform/sanitize_logs,
          filter/softprobe_gold_logs,
          batch/softprobe,
        ]
      exporters: [debug, otlphttp/softprobe]
