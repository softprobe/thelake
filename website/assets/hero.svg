<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 560" fill="none" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">thelake evidence depth</title>
  <desc id="heroDesc">Layered evidence sessions on a warm Softprobe-aligned canvas</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEEDE6"/>
      <stop offset="100%" stop-color="#E4E0DD"/>
    </linearGradient>
    <linearGradient id="layer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F48D16" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#F48D16" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F48D16" stop-opacity="0.06"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="560" rx="18" fill="url(#wash)"/>
  <g opacity="0.95">
    <rect x="64" y="88" width="1312" height="52" rx="8" fill="url(#layer)"/>
    <rect x="64" y="168" width="1312" height="52" rx="8" fill="url(#layer)" opacity="0.85"/>
    <rect x="64" y="248" width="1312" height="52" rx="8" fill="url(#layer)" opacity="0.7"/>
    <rect x="64" y="328" width="1312" height="52" rx="8" fill="url(#layer)" opacity="0.55"/>
    <rect x="64" y="408" width="1312" height="52" rx="8" fill="url(#layer)" opacity="0.4"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#251F19">
    <text x="96" y="122">session / agent.run / retained evidence</text>
    <text x="96" y="202" opacity="0.78">trace / prompts / tools / outcomes</text>
    <text x="96" y="282" opacity="0.62">eval / score / lineage</text>
    <text x="96" y="362" opacity="0.5">regression / curated case</text>
