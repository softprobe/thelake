# Local Docker development configuration for the interactive Lisa stack.
server:
  host: 0.0.0.0
  port: 8090
  max_body_size: 104857600

object_store:
  region: us-east-1
  endpoint: http://minio:9000

query:
  max_connections: 10
  cache_dir: /var/tmp/softprobe/duckdb

maintenance:
  enabled: true
  interval_seconds: 3600
  metadata_enabled: true

ducklake:
  metadata_path: host=ducklake-postgres port=5432 dbname=ducklake user=ducklake password=ducklake
  data_path: s3://warehouse/ducklake/softprobe-dev/
  catalog_alias: softprobe
  metadata_schema: softprobe_dev
  workspace_scope_mode: shared
  extension_path: /app/dist/ducklake.duckdb_extension
  data_inlining_row_limit: 500
  writer_pool_size: 4

session_summary:
  reducer_interval_ms: 1000
