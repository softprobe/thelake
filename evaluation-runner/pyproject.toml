[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "thelake-evaluation-runner"
version = "0.1.0"
description = "Isolated DeepEval runner for thelake online behavior evaluators"
requires-python = ">=3.11"
dependencies = [
  "deepeval==4.2.8",
  "fastapi>=0.115,<1",
  "google-genai>=1,<2",
  "uvicorn[standard]>=0.34,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
