[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "thelake-lisa-agent"
version = "0.1.0"
description = "Workspace-scoped Lisa runtime with reusable AgentSkills and MCP tools"
requires-python = ">=3.12"
dependencies = [
  "apscheduler>=3.11,<4",
  "fastapi>=0.115,<1",
  "fastmcp>=3.4,<4",
  "deepeval==4.2.8",
  "google-genai>=1,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
openhands = ["openhands-sdk==1.54.0"]
test = ["httpx>=0.27,<1", "openhands-sdk==1.54.0", "pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
