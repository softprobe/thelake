server:
  port: 8090
  host: "0.0.0.0"
  max_body_size: 104857600  # 100MB
  worker_threads: null

# Non-secret object-store settings. Credentials come from the environment:
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY for s3:// (MinIO/R2/AWS)
#   GCS_HMAC_ACCESS_KEY_ID / GCS_HMAC_SECRET for gs://
object_store:
  region: "us-east-1"
  endpoint: "http://localhost:9000"  # Local MinIO

query:
  max_connections: 10
  cache_dir: "/tmp/ingest-cache"

maintenance:
  enabled: true
  interval_seconds: 60  # one SQL maintenance script per physical scope
  metadata_enabled: true
  reader_safety_grace_seconds: 300

ducklake:
  metadata_path: "host=localhost port=5432 dbname=ducklake user=ducklake password=ducklake"
  data_path: "./warehouse/ducklake/data/"
  catalog_alias: "softprobe"
  metadata_schema: "softprobe"
  extension_path: "./dist/ducklake.duckdb_extension"
  # Default 500 (DuckLake-aligned). Set 0 only for fixtures that need
  # Parquet-per-batch.
  data_inlining_row_limit: 500
  # Per-scope DuckDB writer connections (1..=16). Default 4.
  writer_pool_size: 4

# Session list summary knobs (always on for postgres catalog).
# Dirty marks after every coalesce traces flush (interval 0 = immediate drain).
# session_summary:
#   reducer_interval_ms: 10000
#   rebuild_interval_ms: 86400000
#   max_sessions_per_reduce: 1000
#   max_reduce_span_seconds: 604800

# Self-monitoring OTLP process instruments (disabled by default). See docs/design.md.
# self_monitoring:
#   enabled: false
#   export_interval_seconds: 60
