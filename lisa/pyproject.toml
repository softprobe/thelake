[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lisa"
version = "0.1.0"
description = "Workspace-scoped Lisa runtime with reusable AgentSkills and MCP tools"
requires-python = ">=3.12"
dependencies = [
  "apscheduler>=3.11,<4",
  "fastapi>=0.115,<1",
  "fastmcp>=3.4,<4",
  "google-genai>=1,<2",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "sqlglot>=26,<31",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
openhands = ["openhands-sdk==1.54.0", "litellm==1.103.4"]
test = ["httpx>=0.27,<1", "openhands-sdk==1.54.0", "litellm==1.103.4", "pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lisa = ["sql/**/*.sql"]

[tool.pytest.ini_options]
# Java-style: src = main, tests = all UTs, datasets = resources, benchmark = runners.
pythonpath = ["src", ".", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
